# Test the whole platform on your own computer (and on your phone on the same Wi-Fi):
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml exec app node scripts/seedDatabase.js   # demo accounts, once
# Then open http://localhost:5000 on the PC, or http://<your-PC-IP>:5000 on the phone.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/les-rois-des-bois
      - MONGODB_URI=mongodb://mongo:27017/les-rois-des-bois
      - JWT_SECRET=local-test-secret-change-me
      - SERVE_FRONTEND_DIR=/app/web
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads

volumes:
  mongo-data:
  uploads:
