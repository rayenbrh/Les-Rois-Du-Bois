# Local / self-hosted deployment of both services.
# On Easypanel create two apps: build path ./backend and ./frontend (each has its Dockerfile).
services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  uploads:
